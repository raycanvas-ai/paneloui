#cloud-config
# First boot of the Panelo server (Ubuntu 24.04): a deploy user with key-only SSH, a firewall that
# opens 22/80/443 only, automatic security updates, swap for builds, and Docker.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, git, ufw, unattended-upgrades, fail2ban]
users:
  - name: panelo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE6PsMCxiKhLPpZ45Rg6AUczYRAmUiTpJRX//5ntrpDs panelo-prod-deploy
write_files:
  - path: /etc/ssh/sshd_config.d/10-panelo.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
runcmd:
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker panelo
  - ufw default deny incoming && ufw default allow outgoing && ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw allow 443/udp && ufw --force enable
  - mkdir -p /srv/panelo && chown panelo:panelo /srv/panelo
  - systemctl restart ssh
